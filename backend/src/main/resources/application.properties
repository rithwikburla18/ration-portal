spring.application.name=ration-portal

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/ration_portal
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:RationPortalDevelopmentSecretKeyChangeBeforeProduction2026}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
