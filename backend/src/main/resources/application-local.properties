spring.application.name=ration-portal-local

# Isolated in-memory database. Local runs must not migrate the Neon database.
spring.datasource.url=jdbc:h2:mem:rationportal_local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Create auxiliary audit/notification tables after Hibernate creates entity tables.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-local.sql
spring.jpa.defer-datasource-initialization=true

# Local integrations stay isolated and never call external notification providers.
app.public-api-base-url=http://localhost:8080
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
