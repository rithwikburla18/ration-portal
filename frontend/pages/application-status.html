<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Track Application Status</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="container"><h1>Track Application Status</h1><p>Enter your application ID to check status.</p><input id="applicationId" type="number" min="1" placeholder="Application ID"><button onclick="checkStatus()">Check Status</button><div id="result"></div></div><script>function checkStatus(){let id=document.getElementById("applicationId").value.trim(),r=document.getElementById("result");if(!id){r.textContent="Please enter an application ID.";return}r.textContent="Checking...";fetch("http://localhost:8080/api/applications/ration-card/"+encodeURIComponent(id)).then(x=>{if(!x.ok)throw Error();return x.json()}).then(a=>{r.innerHTML="<h2>Status: "+a.status+"</h2><p><b>Application ID:</b> "+a.id+"</p><p><b>Applicant:</b> "+a.applicantName+"</p><p><b>Family Members:</b> "+a.familyMembers+"</p><p><b>District:</b> "+a.district+"</p><p><b>Address:</b> "+a.address+"</p><p><b>Submitted:</b> "+a.createdAt+"</p>"}).catch(()=>r.textContent="Application not found or backend unavailable.")}</script></body></html>
