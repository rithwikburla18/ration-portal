<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Ration Card Applications - Admin</title><link rel="stylesheet" href="../css/style.css"><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#222}.topbar{background:#123b68;color:#fff;padding:14px 20px}.container{max-width:1200px;margin:30px auto;padding:25px;background:#fff;border-radius:10px;box-shadow:0 2px 10px #ccc}.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{color:#123b68;margin:0}.subtitle{color:#666;margin-top:6px}.actions{display:flex;gap:10px;margin:25px 0}.search{flex:1;padding:12px;border:1px solid #ccc;border-radius:6px;font-size:15px}.btn{padding:12px 18px;border:0;border-radius:6px;background:#123b68;color:#fff;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin:20px 0}.stat{padding:20px;border-radius:8px;background:#eef4fa;border-left:5px solid #123b68}.stat strong{display:block;font-size:28px;color:#123b68}.stat span{color:#555}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:20px;min-width:900px}th,td{padding:12px;border:1px solid #ddd;text-align:left}th{background:#123b68;color:#fff}.status{font-weight:bold;color:#0a6b35}.empty{text-align:center;padding:30px;color:#666}</style><script src="../config.js"></script></head><body><div class="topbar">Public Distribution System | Ration Portal - Administration</div><div class="container"><div class="header"><div><h1>Ration Card Applications</h1><div class="subtitle">Citizen application management dashboard</div></div><button class="btn" onclick="loadApplications()">?? Refresh</button></div><div class="stats"><div class="stat"><strong id="totalCount">0</strong><span>Total Applications</span></div><div class="stat"><strong id="submittedCount">0</strong><span>Submitted Applications</span></div></div><div class="actions"><input id="searchBox" class="search" type="text" placeholder="Search by applicant name, district or ID..." oninput="filterApplications()"></div><div id="result">Loading applications...</div></div><script>let applications=[];function loadApplications(){document.getElementById("result").innerHTML="<div class=\"empty\">Loading applications...</div>";fetch("http://localhost:8080/api/applications/ration-card").then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(d){applications=Array.isArray(d)?d:[];updateStats();filterApplications()}).catch(function(){document.getElementById("result").innerHTML="<div class=\"empty\">Unable to load applications. Backend may be unavailable.</div>"})}function updateStats(){document.getElementById("totalCount").textContent=applications.length;document.getElementById("submittedCount").textContent=applications.filter(function(a){return a.status==="SUBMITTED"}).length}function filterApplications(){let s=document.getElementById("searchBox").value.toLowerCase().trim(),f=applications.filter(function(a){return String(a.id).includes(s)||String(a.applicantName||"").toLowerCase().includes(s)||String(a.district||"").toLowerCase().includes(s)});if(!f.length){document.getElementById("result").innerHTML="<div class=\"empty\">No matching applications found.</div>";return}let h="<div class=\"table-wrap\"><table><thead><tr><th>ID</th><th>Applicant Name</th><th>Family Members</th><th>District</th><th>Address</th><th>Status</th><th>Submitted At</th></tr></thead><tbody>";f.forEach(function(a){h+="<tr><td>"+a.id+"</td><td>"+a.applicantName+"</td><td>"+a.familyMembers+"</td><td>"+a.district+"</td><td>"+a.address+"</td><td class=\"status\">"+a.status+"</td><td>"+a.createdAt+"</td></tr>"});document.getElementById("result").innerHTML=h+"</tbody></table></div>"}loadApplications();</script></body></html>
