<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Grievance Dashboard</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="container"><h1>Grievance Dashboard</h1><p>View citizen grievances submitted through the Ration Portal.</p><div id="summary"></div><button onclick="loadGrievances()" id="refreshButton">Refresh</button><div id="result">Loading grievances...</div></main><script>const API="http://localhost:8080/api";async function loadGrievances(){const b=document.getElementById("refreshButton"),r=document.getElementById("result"),s=document.getElementById("summary");b.disabled=true;b.textContent="Loading...";try{const response=await fetch(API+"/grievances");if(!response.ok)throw new Error();const grievances=await response.json();s.innerHTML="<p><strong>Total Grievances:</strong> "+grievances.length+" &nbsp; | &nbsp; <strong>Submitted:</strong> "+grievances.filter(g=>g.status==="SUBMITTED").length+"</p>";if(!grievances.length){r.innerHTML="<p>No grievances found.</p>";return}let html="<div style=\"overflow-x:auto\"><table border=\"1\" cellpadding=\"10\" cellspacing=\"0\" style=\"width:100%;border-collapse:collapse\"><thead><tr><th>ID</th><th>Grievance Number</th><th>Applicant</th><th>Ration Card</th><th>Category</th><th>Contact</th><th>Description</th><th>Status</th><th>Submitted</th></tr></thead><tbody>";grievances.forEach(g=>{html+="<tr><td>"+g.id+"</td><td><strong>"+g.grievanceNumber+"</strong></td><td>"+g.applicantName+"</td><td>"+g.rationCardNumber+"</td><td>"+g.category+"</td><td>"+g.contactNumber+"</td><td>"+g.description+"</td><td>"+g.status+"</td><td>"+g.createdAt+"</td></tr>"});html+="</tbody></table></div>";r.innerHTML=html}catch(e){r.textContent="Unable to load grievances. Please make sure the backend is running."}finally{b.disabled=false;b.textContent="Refresh"}}loadGrievances();</script></body></html>
