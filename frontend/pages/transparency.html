<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Transparency Dashboard</title><link rel="stylesheet" href="../css/style.css"><script src="../config.js"></script></head><body><main class="container"><h1>Transparency Dashboard</h1><p>Public summary of key Ration Portal activities.</p><div id="cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:25px"><div class="result-card"><h3>Ration Cards</h3><p id="rationCards">Loading...</p></div><div class="result-card"><h3>Family Members</h3><p id="familyMembers">Loading...</p></div><div class="result-card"><h3>Distribution Records</h3><p id="distributionRecords">Loading...</p></div><div class="result-card"><h3>Applications</h3><p id="applications">Loading...</p></div><div class="result-card"><h3>Grievances</h3><p id="grievances">Loading...</p></div></div><div id="status" style="margin-top:25px"></div></main><script>const API=window.RATION_API_BASE;async function loadDashboard(){try{const response=await fetch(API+"/transparency/summary");if(!response.ok)throw new Error();const d=await response.json();document.getElementById("rationCards").textContent=d.totalRationCards;document.getElementById("familyMembers").textContent=d.totalFamilyMembers;document.getElementById("distributionRecords").textContent=d.totalDistributionRecords;document.getElementById("applications").textContent=d.totalApplications;document.getElementById("grievances").textContent=d.totalGrievances;document.getElementById("status").textContent="Data loaded successfully from the Ration Portal database."}catch(e){document.getElementById("status").textContent="Unable to load dashboard data. Please make sure the backend is running."}}loadDashboard();</script></body></html>
