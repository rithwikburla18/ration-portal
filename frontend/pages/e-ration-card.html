<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Download e-Ration Card</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="container"><h1>Download e-Ration Card</h1><p>Enter your ration card number to view and download your e-Ration Card.</p><input id="rationNumber" placeholder="Enter ration card number"><button onclick="loadCard()">View Card</button><div id="result"></div></main><script>const API="http://localhost:8080/api";function loadCard(){const n=document.getElementById("rationNumber").value.trim();const r=document.getElementById("result");if(!n){r.textContent="Please enter a ration card number.";return;}r.textContent="Loading...";fetch(API+"/ration-cards/"+encodeURIComponent(n)).then(x=>{if(!x.ok)throw new Error();return x.json()}).then(c=>{r.innerHTML="<div class=\"result-card\"><h2>e-Ration Card</h2><p><strong>Ration Card Number:</strong> "+(c.rationCardNumber||"N/A")+"</p><p><strong>Card Type:</strong> "+(c.cardType||"N/A")+"</p><p><strong>Head of Family:</strong> "+(c.headOfFamily||"N/A")+"</p><p><strong>Address:</strong> "+(c.address||"N/A")+"</p><p><strong>District:</strong> "+(c.district||"N/A")+"</p><p><strong>State:</strong> "+(c.state||"N/A")+"</p><p><strong>Status:</strong> "+(c.status||"N/A")+"</p><button onclick=\"window.print()\">Print / Save as PDF</button></div>"}).catch(()=>r.textContent="Ration card not found or backend is unavailable.")}</script></body></html>
