<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Grievance Status</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="container"><h1>Grievance Status</h1><p>Enter your grievance number to check the current status.</p><form id="trackForm"><input id="grievanceNumber" placeholder="Grievance Number (e.g. GRV9926EE27)" required><button type="submit" id="trackButton">Check Status</button></form><div id="result"></div></main><script>const API="http://localhost:8080/api";document.getElementById("trackForm").addEventListener("submit",async function(e){e.preventDefault();const b=document.getElementById("trackButton"),r=document.getElementById("result"),number=document.getElementById("grievanceNumber").value.trim();b.disabled=true;b.textContent="Searching...";r.textContent="";try{const response=await fetch(API+"/grievances/"+encodeURIComponent(number));if(!response.ok)throw new Error("not-found");const g=await response.json();r.innerHTML="<div class=\"result-card\"><h3>Grievance Details</h3><p><strong>Grievance Number:</strong> "+g.grievanceNumber+"</p><p><strong>Applicant Name:</strong> "+g.applicantName+"</p><p><strong>Ration Card Number:</strong> "+g.rationCardNumber+"</p><p><strong>Category:</strong> "+g.category+"</p><p><strong>Description:</strong> "+g.description+"</p><p><strong>Submitted:</strong> "+g.createdAt+"</p><p><strong>Status:</strong> "+g.status+"</p></div>"}catch(e){r.textContent=e.message==="not-found"?"Grievance not found. Please check the grievance number.":"Backend is unavailable. Please start the Spring Boot server."}finally{b.disabled=false;b.textContent="Check Status"}});</script></body></html>
