<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Lodge Grievance</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="container"><h1>Lodge Grievance</h1><p>Submit your complaint or grievance related to ration services.</p><form id="grievanceForm"><input id="name" placeholder="Applicant Name" required><input id="rationNumber" placeholder="Ration Card Number" required><select id="category" required><option value="">Select Grievance Category</option><option>Ration Card</option><option>Fair Price Shop</option><option>Ration Distribution</option><option>Family Member</option><option>Other</option></select><input id="contact" placeholder="Contact Number" required><textarea id="description" placeholder="Describe your grievance" rows="6" required></textarea><button type="submit" id="submitButton">Submit Grievance</button></form><div id="result"></div></main><script>const API="http://localhost:8080/api";document.getElementById("grievanceForm").addEventListener("submit",async function(e){e.preventDefault();const b=document.getElementById("submitButton"),r=document.getElementById("result");b.disabled=true;b.textContent="Submitting...";try{const response=await fetch(API+"/grievances",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({applicantName:document.getElementById("name").value.trim(),rationCardNumber:document.getElementById("rationNumber").value.trim(),category:document.getElementById("category").value,contactNumber:document.getElementById("contact").value.trim(),description:document.getElementById("description").value.trim()})});if(!response.ok)throw new Error();const g=await response.json();r.innerHTML="<div class=\"result-card\"><h3>Grievance Submitted Successfully</h3><p><strong>Grievance ID:</strong> "+g.grievanceNumber+"</p><p>Please keep this ID for future reference.</p><p><strong>Status:</strong> "+g.status+"</p></div>";this.reset()}catch(e){r.textContent="Unable to submit grievance. Please make sure the backend is running."}finally{b.disabled=false;b.textContent="Submit Grievance"}});</script></body></html>
