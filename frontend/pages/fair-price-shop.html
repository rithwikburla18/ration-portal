<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Locate Fair Price Shop</title><link rel="stylesheet" href="../css/style.css"><script src="../config.js"></script><script src="../js/auth-guard.js"></script></head><body><main class="container"><h1>Locate Fair Price Shop</h1><p>Enter your district to find a Fair Price Shop.</p><input id="district" placeholder="Enter district"><button onclick="searchShops()">Search Shops</button><div id="result"></div></main><script>const shops=[{id:"FPS001",name:"Main Road Fair Price Shop",district:"Karimnagar",address:"Main Road, Karimnagar",status:"OPEN"},{id:"FPS002",name:"Market Area Fair Price Shop",district:"Karimnagar",address:"Market Road, Karimnagar",status:"OPEN"},{id:"FPS003",name:"Bus Stand Fair Price Shop",district:"Warangal",address:"Bus Stand Road, Warangal",status:"OPEN"}];function searchShops(){const d=document.getElementById("district").value.trim().toLowerCase();const r=document.getElementById("result");if(!d){r.textContent="Please enter a district.";return;}const found=shops.filter(s=>s.district.toLowerCase().includes(d));if(!found.length){r.textContent="No Fair Price Shops found for this district.";return;}r.innerHTML=found.map(s=>"<div class=\"result-card\"><h3>"+s.name+"</h3><p><strong>FPS ID:</strong> "+s.id+"</p><p><strong>District:</strong> "+s.district+"</p><p><strong>Address:</strong> "+s.address+"</p><p><strong>Status:</strong> "+s.status+"</p></div>").join("")}</script></body></html>
