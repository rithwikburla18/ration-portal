<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citizen Registration - Ration Portal</title>
<link rel="stylesheet" href="../css/style.css">
<script src="../config.js"></script></head>
<body>
<header class="top-bar"><div>Public Distribution System</div></header>
<nav class="navbar"><div class="brand"><span class="brand-logo">IN</span><span>RATION PORTAL</span></div><div class="nav-links"><a href="../index.html">Home</a><a href="login.html">Citizen Login</a></div></nav>
<main class="container">
<section class="form-section">
<h1>Citizen Registration</h1>
<p>Create an account to access citizen services.</p>
<form id="registerForm">
<label for="fullName">Full Name</label>
<input id="fullName" type="text" required maxlength="120" autocomplete="name">
<label for="email">Email Address</label>
<input id="email" type="email" required maxlength="150" autocomplete="email">
<label for="password">Password</label>
<input id="password" type="password" required minlength="8" autocomplete="new-password">
<button type="submit" class="primary-btn">Create Account</button>
</form>
<div id="registerResult"></div>
<p>Already registered? <a href="login.html">Sign in</a></p>
</section>
</main>
<footer><p>Educational Project ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â Not an official Government of India website.</p></footer>
<script>
const API="http://localhost:8080/api";
document.getElementById("registerForm").addEventListener("submit",async function(e){e.preventDefault();const result=document.getElementById("registerResult");result.textContent="Creating account...";try{const response=await fetch(API+"/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fullName:document.getElementById("fullName").value.trim(),email:document.getElementById("email").value.trim(),password:document.getElementById("password").value})});const data=await response.json();if(!response.ok)throw new Error(data.message||"Registration failed");result.textContent="Registration successful. Redirecting to login...";setTimeout(()=>window.location.href="login.html",900)}catch(error){result.textContent=error.message}});
</script>
</body>
</html>
